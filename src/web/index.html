<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Car</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 480px;
      margin: 4rem auto;
      padding: 0 1rem;
      color: #1a1a1a;
    }
    h1 { font-size: 1.25rem; font-weight: 600; }
    .level { font-size: 3.5rem; font-weight: 600; margin: 1rem 0 0.5rem; }
    .bar {
      height: 12px;
      background: #eee;
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 0.75rem;
    }
    .bar-fill {
      height: 100%;
      width: 0%;
      background: #4a9d5f;
      border-radius: 6px;
      transition: width 0.6s ease, background-color 0.3s ease;
    }
    .bar-fill.low { background: #c0392b; }
    .bar-fill.charging { background: #2d7dd2; }
    .status { color: #666; font-size: 0.9rem; }
    .status.charging { color: #2d7dd2; font-weight: 600; }
    .error { color: #c0392b; }
    .updated { color: #999; font-size: 0.8rem; margin-top: 2rem; }
    .actions { margin-top: 1.5rem; display: flex; gap: 0.5rem; }
    button {
      font: inherit;
      padding: 0.5rem 1rem;
      cursor: pointer;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: #fff;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .feedback {
      margin-top: 0.75rem;
      font-size: 0.85rem;
      color: #666;
      min-height: 1.2em;
    }
  </style>
</head>
<body>
  <h1>my-car</h1>
  <div class="level" id="level">--</div>
  <div class="bar"><div class="bar-fill" id="barFill"></div></div>
  <div class="status" id="status">Connecting...</div>
  <div class="updated" id="updated"></div>

  <div class="actions">
    <button id="start">Start charging</button>
    <button id="stop">Stop charging</button>
  </div>
  <div class="feedback" id="feedback"></div>

  <script>
    const API = "http://localhost:7071/api";
    const DEVICE_ID = "my-car";
    const POLL_INTERVAL_MS = 5000;
    const CONFIRM_TIMEOUT_MS = 30000;
    const LOW_BATTERY_THRESHOLD = 20;

    const levelEl = document.getElementById("level");
    const barFillEl = document.getElementById("barFill");
    const statusEl = document.getElementById("status");
    const updatedEl = document.getElementById("updated");
    const startBtn = document.getElementById("start");
    const stopBtn = document.getElementById("stop");
    const feedbackEl = document.getElementById("feedback");

    // What we are waiting for the car to confirm, or null when nothing is pending
    let pendingCharging = null;
    let pendingSince = 0;

    function clearPending(message = "") {
      pendingCharging = null;
      feedbackEl.textContent = message;
    }

    function render(data) {
      levelEl.textContent = `${data.batteryLevel}%`;

      barFillEl.style.width = `${data.batteryLevel}%`;
      barFillEl.className = "bar-fill";
      if (data.isCharging) {
        barFillEl.classList.add("charging");
      } else if (data.batteryLevel <= LOW_BATTERY_THRESHOLD) {
        barFillEl.classList.add("low");
      }

      statusEl.textContent = data.isCharging ? "Charging" : "Not charging";
      statusEl.className = data.isCharging ? "status charging" : "status";

      updatedEl.textContent =
        `Last updated ${new Date(data.lastUpdated).toLocaleTimeString()}`;

      // Full battery cannot start charging, so grey the button out
      startBtn.disabled = data.batteryLevel >= 100;
    }

    async function refresh() {
      try {
        const res = await fetch(`${API}/cars/${DEVICE_ID}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        const data = await res.json();

        // Fail loudly on an unexpected payload instead of rendering "undefined"
        if (typeof data.batteryLevel !== "number" ||
            typeof data.isCharging !== "boolean") {
          throw new Error(`Unexpected payload: ${JSON.stringify(data)}`);
        }

        render(data);

        // Drop the pending notice once the car reports the state we asked for
        if (pendingCharging !== null) {
          if (data.isCharging === pendingCharging) {
            clearPending();
          } else if (Date.now() - pendingSince > CONFIRM_TIMEOUT_MS) {
            clearPending("Command sent, but the car has not reported the new state.");
          }
        }
      } catch (err) {
        statusEl.textContent = `Error: ${err.message}`;
        statusEl.className = "status error";
      }
    }

    async function sendCommand(action) {
      startBtn.disabled = true;
      stopBtn.disabled = true;
      feedbackEl.textContent = "Sending...";

      try {
        const res = await fetch(`${API}/cars/${DEVICE_ID}/charging/${action}`, {
          method: "POST"
        });
        const data = await res.json();

        if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);

        if (data.accepted) {
          pendingCharging = (action === "start");
          pendingSince = Date.now();
          feedbackEl.textContent = "Car acknowledged. Updating...";
          setTimeout(refresh, 1500);
        } else {
          clearPending(`Car rejected the command (status ${data.deviceStatus})`);
        }
      } catch (err) {
        clearPending(`Failed: ${err.message}`);
      } finally {
        stopBtn.disabled = false;
        // startBtn is re-enabled by render() based on the actual battery level
        refresh();
      }
    }

    startBtn.addEventListener("click", () => sendCommand("start"));
    stopBtn.addEventListener("click", () => sendCommand("stop"));

    refresh();
    setInterval(refresh, POLL_INTERVAL_MS);
  </script>
</body>
</html>
